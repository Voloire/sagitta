[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sagitta"
version = "0.1.0"
description = "Referto forense e banco di prova per astrofotografia"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "astropy>=6.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "pip-audit>=2.10.1", "bandit>=1.7", "build>=1.2"]

[project.scripts]
sagitta = "sagitta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sagitta = ["dialects/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "smoke: test end-to-end che lanciano l'eseguibile installato",
    "slow: test che superano i 10 secondi",
]
